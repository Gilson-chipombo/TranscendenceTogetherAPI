services:
  redis:
    image: redis:7-alpine
    ports: 
      - 6379:6379
    command: >
      redis-server
      --requirepass '${REDISPASS}'
      --protected-mode yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly no
      --save 60 1
    networks:
      - transcendence
    volumes:
      - redis_storage:/data

  postgres:
    image: postgres:16
    container_name: transcendence_postgres
    restart: always
    environment:
      POSTGRES_USER: transcendence
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: transcendence_db
    networks:
      - transcendence
    volumes:
      - postgres_data:/var/lib/postgresql/data
    secrets:
      - postgres_password
    ports:
      - "5432:5432"
    
